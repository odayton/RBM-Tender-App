events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting - increased limits for login
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;

    # Upstream for the application - Updated for native EC2 deployment
    upstream rbm_app {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # HTTP server block - redirect to HTTPS
    server {
        listen 80;
        server_name rbm-intranet.com www.rbm-intranet.com;
        
        # Redirect all HTTP traffic to HTTPS
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server block - main application
    server {
        listen 443 ssl http2;
        server_name rbm-intranet.com www.rbm-intranet.com;
        
        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/rbm-intranet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rbm-intranet.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/rbm-intranet.com/chain.pem;
        
        # SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # Security headers for HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy settings with increased timeouts
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";

        # Main application
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://rbm_app;
            proxy_redirect off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Login endpoint with increased timeouts and relaxed rate limiting
        location /login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://rbm_app;
            proxy_redirect off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://rbm_app;
            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Admin endpoints with rate limiting
        location /admin {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://rbm_app;
            proxy_redirect off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static files - serve directly from nginx
        location /static/ {
            alias /home/ec2-user/RBM-Tender-App-main/app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
} 