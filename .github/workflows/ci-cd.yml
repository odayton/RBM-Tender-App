name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Add descriptive run names
run-name: |
  ${{ github.ref_name == 'main' && '🚀 Production Deployment' || '' }}
  ${{ github.event_name == 'pull_request' && '🔍 PR Testing' || '' }}
  ${{ github.event_name == 'workflow_dispatch' && '⚡ Manual Trigger' || '' }}
  - ${{ github.head_commit.message }}

permissions:
  contents: read

# Cancel older runs for PRs/branches, but NOT on main
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: '3.11'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install dev tooling
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base_requirements.txt
        pip install -r requirements/dev_requirements.txt

    - name: Formatting (placeholder)
      run: echo "Code formatting check passed"

    - name: Lint (placeholder)
      run: echo "Linting passed"

    - name: Bandit (security)
      run: bandit -r app/ -f json -o bandit-report.json || true

    - name: Safety (v2 or v3)
      run: |
        safety check --json --output safety-report.json \
          || safety scan -o safety-report.json || true

    - name: Upload quality artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: |
          bandit-report.json
          safety-report.json

  test:
    runs-on: ubuntu-latest
    needs: quality-checks

    # Docker Hub official images, authenticate the *service pulls*
    services:
      postgres:
        image: docker.io/library/postgres:15
        credentials:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
        ports:
          - 5432:5432
      redis:
        image: docker.io/library/redis:7
        credentials:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
        ports:
          - 6379:6379

    env:
      FLASK_CONFIG: testing
      TEST_DATABASE_URL: postgresql://postgres:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}
      DATABASE_URL: postgresql://postgres:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      SENTRY_DSN: ""

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install test deps (incl. psql client)
      run: |
        python3 -m venv test-env
        . test-env/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements/base_requirements.txt
        pip install -r requirements/test_requirements.txt
        sudo apt-get update -y
        sudo apt-get install -y postgresql-client

    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL..."
        for i in {1..30}; do
          PGPASSWORD=${{ secrets.TEST_DB_PASSWORD }} psql -h localhost -U postgres -d ${{ secrets.TEST_DB_NAME }} -c "select 1" >/dev/null 2>&1 && break
          sleep 2
        done

    - name: Init test DB schema (drop/create all)
      run: |
        . test-env/bin/activate
        python - <<'PY'
        from app import create_app, db
        app = create_app()
        with app.app_context():
            db.drop_all()
            db.create_all()
            print("Test database tables created")
        PY

    - name: Run unit tests with coverage + JUnit
      run: |
        . test-env/bin/activate
        mkdir -p test-results coverage-report
        python -m pytest tests/unit/ -v --tb=short \
          --junitxml=test-results/junit.xml \
          --cov=app --cov-report=xml:coverage-report/coverage.xml --cov-report=term

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          test-results/
          coverage-report/

  build:
    runs-on: ubuntu-latest
    needs: [quality-checks, test]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install prod deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base_requirements.txt
        pip install -r requirements/prod_requirements.txt

    - name: Create deployment package
      run: |
        set -euo pipefail
        mkdir -p deployment-package
        cp -r app/ requirements/ deployment-package/
        [ -d migrations ] && cp -r migrations/ deployment-package/ || true
        [ -d config ] && cp -r config/ deployment-package/ || true
        [ -d scripts ] && cp -r scripts/ deployment-package/ || true
        ls *.py >/dev/null 2>&1 && cp *.py deployment-package/ || true

        # (left for reference; not executed remotely)
        cat > deployment-package/deploy.sh << 'EOF'
        #!/bin/bash
        set -euo pipefail
        echo "Starting deployment..."
        python3 -m pip install --user --upgrade pip
        python3 -m pip install --user -r requirements/base_requirements.txt
        python3 -m pip install --user -r requirements/prod_requirements.txt
        export FLASK_APP=app_runner.py
        export FLASK_ENV=production
        export FLASK_CONFIG=production
        python3 -c 'from app import create_app; create_app(); print("App OK")'
        python3 -m flask db upgrade || true
        sudo systemctl restart rbm-tender-app
        sleep 10
        curl -f http://localhost:5000/health
        echo "Deployment completed"
        EOF
        chmod +x deployment-package/deploy.sh

        tar -czf rbm-tender-app-$(date +%Y%m%d-%H%M%S).tar.gz deployment-package/

    - uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: rbm-tender-app-*.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: deployment-package

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to production server
      run: |
        set -euo pipefail
        tar -xzf rbm-tender-app-*.tar.gz
        
        # Configure AWS region
        export AWS_DEFAULT_REGION=us-east-1

        echo "Testing SSH connectivity..."
        echo "SSH Host: ${{ secrets.SSH_HOST }}"
        echo "SSH User: ${{ secrets.SSH_USER }}"
        
        # Test basic connectivity
        echo "Testing ping..."
        ping -c 3 ${{ secrets.SSH_HOST }} || echo "Ping failed"
        
        # Test SSH port
        echo "Testing SSH port 22..."
        nc -zv ${{ secrets.SSH_HOST }} 22 || echo "Port 22 not accessible"
        
        # Test SSH connection with verbose output and keepalive
        echo "Testing SSH connection..."
        if ssh -vvv -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH OK'"; then
          echo "SSH connection successful"
        else
          echo "SSH connection failed - trying Systems Manager fallback..."
          # Try to restart SSH service via Systems Manager
          echo "Attempting to restart SSH service via Systems Manager..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo systemctl restart ssh", "sudo systemctl enable ssh", "sudo systemctl status ssh --no-pager"]' \
            --output text --query 'Command.CommandId' 2>/dev/null || echo "FAILED")
          
          if [ "$COMMAND_ID" != "FAILED" ]; then
            echo "SSH service restart command sent via Systems Manager (ID: $COMMAND_ID)"
            echo "Waiting 30 seconds for SSH service to restart..."
            sleep 30
            
            echo "Testing SSH connection again..."
            if ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH OK after restart'"; then
              echo "SSH connection successful after restart"
            else
              echo "SSH still not working - instance may need restart"
              exit 1
            fi
          else
            echo "Systems Manager command failed - instance may be unresponsive"
            exit 1
          fi
        fi

        echo "Preparing directories..."
        ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          sudo mkdir -p /opt/rbm-tender-app /tmp/rbm-tender-app
          sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /tmp/rbm-tender-app
          sudo chmod -R 755 /tmp/rbm-tender-app
        "

        echo "Uploading package with rsync..."
        rsync -avz --progress \
          -e "ssh -o ConnectTimeout=120 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6" \
          deployment-package/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/rbm-tender-app/

        echo "Installing on server..."
        ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
          set -euo pipefail
          
          # Create smart backup before deployment
          echo "Creating smart backup..."
          if [ -f /opt/rbm-tender-app/scripts/deployment/smart_backup.py ]; then
            sudo python3 /opt/rbm-tender-app/scripts/deployment/smart_backup.py --app-path /opt/rbm-tender-app --backup-dir /opt --max-backups 3 || echo "Backup skipped or failed - continuing with deployment"
          else
            echo "Smart backup script not found, creating manual backup..."
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            sudo cp -r /opt/rbm-tender-app /opt/rbm-tender-app.backup.$TIMESTAMP
            echo "Manual backup created: /opt/rbm-tender-app.backup.$TIMESTAMP"
          fi
          
          # Backup existing .env file if it exists
          if [ -f /opt/rbm-tender-app/config/.env ]; then
            echo "Backing up existing .env file..."
            sudo cp /opt/rbm-tender-app/config/.env /tmp/rbm-tender-app.env.backup
          fi
          
          sudo rsync -a --delete /tmp/rbm-tender-app/ /opt/rbm-tender-app/
          
          # Restore .env file if backup exists
          if [ -f /tmp/rbm-tender-app.env.backup ]; then
            echo "Restoring .env file..."
            sudo mv /tmp/rbm-tender-app.env.backup /opt/rbm-tender-app/config/.env
            sudo chown ubuntu:ubuntu /opt/rbm-tender-app/config/.env
            sudo chmod 600 /opt/rbm-tender-app/config/.env
          fi
          cd /opt/rbm-tender-app

          # Ensure venv exists
          if [ ! -d venv ]; then
            python3 -m venv venv
          fi

          PYBIN="/opt/rbm-tender-app/venv/bin/python"
          PIP="/opt/rbm-tender-app/venv/bin/pip"
          FLASK="/opt/rbm-tender-app/venv/bin/flask"

          echo "Upgrading pip (timeout: 15 minutes)..."
          timeout 900 $PYBIN -m pip install --upgrade pip --verbose || echo "Pip upgrade timed out"
          
          echo "Installing Python packages (timeout: 20 minutes)..."
          timeout 1200 $PIP install -r requirements/base_requirements.txt -r requirements/prod_requirements.txt --verbose --no-cache-dir || echo "Package installation timed out"

          echo "Python in use: $($PYBIN -V)"
          echo "Flask version: $($PYBIN -c "import flask; print(flask.__version__)")"

          export FLASK_APP=app_runner.py
          export FLASK_ENV=production
          export FLASK_CONFIG=production
          export SECRET_KEY="${{ secrets.PROD_SECRET_KEY }}"
          export DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}"
          export REDIS_URL="${{ secrets.PROD_REDIS_URL }}"
          export SENTRY_DSN="${{ secrets.SENTRY_DSN }}"

          [ -z "$SECRET_KEY" ] && echo "ERROR: SECRET_KEY not set" && exit 1
          [ -z "$DATABASE_URL" ] && echo "ERROR: DATABASE_URL not set" && exit 1

          cat > test_app.py << 'PYEOF'
          from app import create_app
          app = create_app()
          print("App OK")
          PYEOF
          $PYBIN test_app.py
          timeout 120 $FLASK db upgrade || echo "Database upgrade timed out"

          if [ -f /etc/systemd/system/rbm-tender-app.service ]; then
            sudo sed -i "s|^ExecStart=.*|ExecStart=/opt/rbm-tender-app/venv/bin/python /opt/rbm-tender-app/app_runner.py|" /etc/systemd/system/rbm-tender-app.service
          fi

          # Environment variables are now loaded from .env file, no need to modify service file

          # Clean up disk space to prevent SSH issues
          echo "Cleaning up disk space..."
          sudo journalctl --vacuum-time=7d || true
          sudo apt clean || true
          sudo find /var/log -name "*.log" -type f -size +50M -exec truncate -s 0 {} \; || true
          
          # Configure SSH keepalive to prevent connection drops
          echo "Configuring SSH keepalive settings..."
          sudo sed -i "s/#ClientAliveInterval 0/ClientAliveInterval 60/" /etc/ssh/sshd_config
          sudo sed -i "s/#ClientAliveCountMax 3/ClientAliveCountMax 3/" /etc/ssh/sshd_config
          if ! grep -q "TCPKeepAlive yes" /etc/ssh/sshd_config; then
            echo "TCPKeepAlive yes" | sudo tee -a /etc/ssh/sshd_config
          fi
          
          # Ensure SSH service remains enabled
          sudo systemctl enable ssh || true
          
          sudo systemctl daemon-reload
          timeout 30 sudo systemctl reload-or-restart rbm-tender-app || echo "Service restart timed out"
          sleep 10
          sudo systemctl status rbm-tender-app --no-pager || true
          
          # Verify SSH service is still working
          sudo systemctl is-enabled ssh || echo "WARNING: SSH service is not enabled"
          
          # Additional diagnostics from troubleshooting guide
          echo "=== DIAGNOSTIC INFORMATION ==="
          echo "Service status:"
          sudo systemctl status rbm-tender-app --no-pager || true
          echo ""
          echo "Recent service logs:"
          sudo journalctl -u rbm-tender-app --since "5 minutes ago" --no-pager || true
          echo ""
          echo "Port 5000 status:"
          sudo ss -tlnp | grep :5000 || echo "Port 5000 not listening"
          echo ""
          echo "Nginx status:"
          sudo systemctl status nginx --no-pager || true
          echo ""
          
          timeout 30 curl -f http://localhost:5000/health || echo "Health check timed out"
        '

    - name: Health check verification
      run: |
        echo "Waiting for application to fully start..."
        sleep 30
        
        for i in {1..8}; do
          echo "Attempt $i: http://${{ secrets.APP_HOST }}/health"
          
          # Test local health first
          echo "Testing local health endpoint..."
          if curl -f -s --connect-timeout 5 --max-time 10 http://localhost:5000/health; then
            echo "Local health check passed"
          else
            echo "Local health check failed"
          fi
          
          # Test external health endpoint
          if curl -f -s --connect-timeout 10 --max-time 30 http://${{ secrets.APP_HOST }}/health; then
            echo "External health check passed"; exit 0
          else
            echo "External health check failed"
            
            # Fallback: test with IP address if domain fails
            echo "Trying fallback with IP address..."
            if curl -f -s --connect-timeout 10 --max-time 30 -H "Host: ${{ secrets.APP_HOST }}" http://54.206.238.122/health; then
              echo "Fallback health check passed"; exit 0
            else
              echo "Fallback health check also failed"
            fi
          fi
          
          [ $i -eq 8 ] && echo "Health check failed after 8 attempts" && exit 1
          echo "Waiting 20 seconds before next attempt..."
          sleep 20
        done

    - name: Done
      if: success()
      run: |
        echo "Deployment successful: http://${{ secrets.APP_HOST }}"
