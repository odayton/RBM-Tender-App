name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Principle of least privilege
permissions:
  contents: read
  packages: read

# Prevent overlapping deploys on same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Job 1: Code Quality and Security Checks
  quality-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install dev tooling
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base_requirements.txt
        pip install -r requirements/dev_requirements.txt

    - name: Formatting (placeholder)
      run: |
        # Replace with "ruff format --check ." / "black --check ."
        echo "Code formatting check passed"

    - name: Lint (placeholder)
      run: |
        # Replace with "ruff check ." / "pylint app"
        echo "Linting passed"

    - name: Bandit (security)
      run: |
        bandit -r app/ -f json -o bandit-report.json || true

    - name: Safety (v2 or v3)
      run: |
        safety check --json --output safety-report.json \
          || safety scan -o safety-report.json || true

    - name: Upload quality artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: |
          bandit-report.json
          safety-report.json

  # Job 2: Test Suite
  test:
    runs-on: ubuntu-latest
    needs: quality-checks

    # Use GHCR mirrors to avoid Docker Hub auth/rate limits
    services:
      postgres:
        image: ghcr.io/library/postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 5432:5432
      redis:
        image: ghcr.io/library/redis:7
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 6379:6379

    env:
      FLASK_CONFIG: testing
      TEST_DATABASE_URL: postgresql://postgres:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}
      DATABASE_URL: postgresql://postgres:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      SENTRY_DSN: ""

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install test deps (incl. psql client)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base_requirements.txt
        pip install -r requirements/test_requirements.txt
        sudo apt-get update -y
        sudo apt-get install -y postgresql-client

    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL..."
        for i in {1..30}; do
          PGPASSWORD=${{ secrets.TEST_DB_PASSWORD }} psql -h localhost -U postgres -d ${{ secrets.TEST_DB_NAME }} -c "select 1" >/dev/null 2>&1 && break
          sleep 2
        done

    - name: Init test DB schema (drop/create all)
      run: |
        python - <<'PY'
        from app import create_app, db
        app = create_app()
        with app.app_context():
            db.drop_all()
            db.create_all()
            print("Test database tables created")
        PY

    - name: Run unit tests with coverage + JUnit
      run: |
        mkdir -p test-results coverage-report
        python -m pytest tests/unit/ -v --tb=short \
          --junitxml=test-results/junit.xml \
          --cov=app --cov-report=xml:coverage-report/coverage.xml --cov-report=term

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          test-results/
          coverage-report/

  # Job 3: Build and Package (main only)
  build:
    runs-on: ubuntu-latest
    needs: [quality-checks, test]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install prod deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base_requirements.txt
        pip install -r requirements/prod_requirements.txt

    - name: Create deployment package
      run: |
        set -euo pipefail
        mkdir -p deployment-package
        cp -r app/ requirements/ deployment-package/
        [ -d migrations ] && cp -r migrations/ deployment-package/ || true
        [ -d config ] && cp -r config/ deployment-package/ || true
        ls *.py >/dev/null 2>&1 && cp *.py deployment-package/ || true

        cat > deployment-package/deploy.sh << 'EOF'
        #!/bin/bash
        set -euo pipefail
        echo "Starting deployment..."
        python3 -m pip install --user --upgrade pip
        python3 -m pip install --user -r requirements/base_requirements.txt
        python3 -m pip install --user -r requirements/prod_requirements.txt
        export FLASK_APP=app_runner.py
        export FLASK_ENV=production
        # Ensure app imports; prefer upgrade only (no forced init/migrate)
        python3 -c 'from app import create_app; create_app(); print("App OK")'
        python3 -m flask db upgrade || true
        sudo systemctl restart rbm-tender-app
        sleep 10
        curl -f http://localhost:5000/health
        echo "Deployment completed"
        EOF
        chmod +x deployment-package/deploy.sh

        tar -czf rbm-tender-app-$(date +%Y%m%d-%H%M%S).tar.gz deployment-package/

    - uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: rbm-tender-app-*.tar.gz

  # Job 4: Deploy to Production (main only)
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: deployment-package

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to production server
      run: |
        set -euo pipefail
        tar -xzf rbm-tender-app-*.tar.gz

        echo "Testing SSH..."
        ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH OK'"

        echo "Stopping service & preparing dirs..."
        ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          sudo systemctl stop rbm-tender-app || true
          sudo mkdir -p /opt/rbm-tender-app /tmp/rbm-tender-app
        "

        echo "Uploading package..."
        scp -o ConnectTimeout=30 -o StrictHostKeyChecking=no -r deployment-package/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/rbm-tender-app/

        echo "Installing on server..."
        ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
          set -euo pipefail
          sudo rsync -a --delete /tmp/rbm-tender-app/ /opt/rbm-tender-app/
          cd /opt/rbm-tender-app

          # Prefer venv; fall back to system with --break-system-packages
          if [ -d venv ]; then
            . venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements/base_requirements.txt -r requirements/prod_requirements.txt
          else
            python3 -m venv venv || true
            if [ -d venv ]; then
              . venv/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements/base_requirements.txt -r requirements/prod_requirements.txt
            else
              python3 -m pip install --upgrade pip --break-system-packages
              python3 -m pip install -r requirements/base_requirements.txt -r requirements/prod_requirements.txt --break-system-packages
            fi
          fi

          export FLASK_APP=app_runner.py
          export FLASK_ENV=production
          python -c "from app import create_app; create_app(); print(\"App OK\")"
          python -m flask db upgrade || true

          sudo systemctl daemon-reload
          sudo systemctl start rbm-tender-app
          sleep 10
          sudo systemctl status rbm-tender-app --no-pager || true
          curl -f http://localhost:5000/health
        '

    - name: Health check verification
      run: |
        for i in {1..5}; do
          echo "Attempt $i: http://${{ secrets.APP_HOST }}/health"
          if curl -f -s --connect-timeout 10 --max-time 30 http://${{ secrets.APP_HOST }}/health; then
            echo "✅ Health check passed"; exit 0
          fi
          [ $i -eq 5 ] && echo "❌ Health check failed" && exit 1
          sleep 15
        done

    - name: Done
      if: success()
      run: |
        echo "✅ Deployment successful: http://${{ secrets.APP_HOST }}"
