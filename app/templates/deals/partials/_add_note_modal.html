<!-- Add Note Modal -->
<div class="modal fade" id="addNoteModal" tabindex="-1" role="dialog" aria-labelledby="addNoteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addNoteModalLabel">
                    <i class="fas fa-sticky-note mr-2"></i>Add Note to Deal
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form method="POST" action="{{ url_for('crm.create_note') }}">
                <div class="modal-body">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <input type="hidden" name="deal_id" value="{{ deal.id }}"/>
                    
                    <div class="form-group">
                        <label for="note_title">Note Title *</label>
                        <input type="text" class="form-control" id="note_title" name="title" required 
                               placeholder="Enter a descriptive title for this note">
                    </div>
                    
                    <div class="form-group">
                        <label for="note_content">Note Content *</label>
                        <textarea class="form-control" id="note_content" name="content" rows="6" required
                                  placeholder="Enter the details of your note..."></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="note_type">Note Type</label>
                                <select class="form-control" id="note_type" name="note_type">
                                    <option value="GENERAL">General</option>
                                    <option value="TECHNICAL">Technical</option>
                                    <option value="COMMERCIAL">Commercial</option>
                                    <option value="FOLLOW_UP">Follow Up</option>
                                    <option value="INTERNAL">Internal</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="note_tags">Tags</label>
                                <input type="text" class="form-control" id="note_tags" name="tags"
                                       placeholder="Enter tags separated by commas">
                                <small class="form-text text-muted">Example: urgent, follow-up, technical</small>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="is_important" name="is_important">
                                <label class="form-check-label" for="is_important">
                                    Mark as Important
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="is_internal" name="is_internal">
                                <label class="form-check-label" for="is_internal">
                                    Internal Note (not visible to customer)
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save mr-1"></i>Save Note
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
